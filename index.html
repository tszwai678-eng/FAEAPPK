<script>

const firebaseConfig = {
  apiKey: "AIzaSyDik4UsOMjmppT22GcRGjGG1GgLPPtvj6Q",
  authDomain: "fae-ap-pk.firebaseapp.com",
  databaseURL: "https://fae-ap-pk-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fae-ap-pk"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ✅ 排名積分
const rankPoints = {
1:50,2:42,3:37,4:33,5:30,6:27,7:24,8:21,9:18,10:15,
11:13,12:11,13:9,14:7,15:5,16:3,17:3,18:3,19:3,20:3,
21:2,22:2,23:2,24:2,25:2,
26:1,27:1,28:1,29:1,30:1,
31:-1,32:-1,33:-1,
34:-2,35:-2,36:-2,37:-2
};

// ✅ 即時監聽排名
db.ref("scores").on("value",snapshot=>{
    const data = snapshot.val();
    if(!data) return;

    let arr = [];
    for(let name in data){
        arr.push({
            name:name,
            team:data[name].team,
            total:data[name].total
        });
    }

    arr.sort((a,b)=>b.total-a.total);

    const table = document.getElementById("scoreTable");
    table.innerHTML="";

    arr.forEach((p,i)=>{
        const rank=i+1;
        const point=rankPoints[rank]??"";

        table.innerHTML+=`
        <tr>
            <td>${rank}</td>
            <td>${point}</td>
            <td>${p.name}</td>
            <td>${p.team}</td>
            <td>${p.total}</td>
            <td><input type="number" id="add_${p.name}"></td>
        </tr>`;
    });
});

// ✅ ✅ ✅ 穩定版本 updateAll
function updateAll(){

    db.ref("scores").once("value").then(snapshot=>{
        const data = snapshot.val();
        if(!data) return;

        let updates = {};

        for(let name in data){
            const input = document.getElementById("add_"+name);
            if(!input) continue;

            const value = parseFloat(input.value);

            if(!isNaN(value) && value !== 0){
                updates["scores/"+name+"/total"] =
                    (data[name].total || 0) + value;
            }
        }

        if(Object.keys(updates).length === 0){
            alert("沒有輸入任何分數");
            return;
        }

        db.ref().update(updates).then(()=>{
            document.querySelectorAll("input[type=number]")
                .forEach(i=>i.value="");
            alert("✅ 本次分數已全部更新");
        });
    });
}

// ✅ 新增參賽者
function addPlayer(){
    const name=document.getElementById("newName").value.trim();
    const team=document.getElementById("newTeam").value.trim();

    if(!name||!team){
        alert("請輸入姓名及隊伍");
        return;
    }

    db.ref("scores/"+name).once("value").then(snapshot=>{
        if(snapshot.exists()){
            alert("此參賽者已存在");
        }else{
            db.ref("scores/"+name).set({
                team:team,
                total:0
            });
            alert("✅ 已新增參賽者");
        }
    });
}

</script>
