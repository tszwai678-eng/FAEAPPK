<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>即時積分排名表</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
    font-family:Arial;
    background:#f2f4f8;
    padding:20px;
    margin:0;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#333;
    color:white;
}

button{
    padding:6px 12px;
    margin:5px;
    cursor:pointer;
}

.rank1{
    background:gold;
}

.rank2{
    background:silver;
}

.rank3{
    background:#cd7f32;
    color:white;
}

input{
    width:70px;
    text-align:center;
}

.pointsCol{
    font-weight:bold;
    color:#1976d2;
}

.addBox{
    background:white;
    padding:15px;
    border-radius:8px;
}

.deleteBtn{
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:4px;
}

.deleteBtn:hover{
    background:#b71c1c;
}
</style>
</head>

<body>

<h1>即時積分排名表</h1>

<div class="addBox">
<b>➕ 新增參賽者</b><br><br>
姓名: <input type="text" id="newName">
隊伍: <input type="text" id="newTeam">
<button onclick="addPlayer()">新增</button>
</div>

<button onclick="updateAll()">✅ 更新本次分數</button>
<button onclick="resetAll()">🔒 重設全部 (密碼8888)</button>

<table>
<thead>
<tr>
<th>排名</th>
<th>該排名積分</th>
<th>姓名</th>
<th>隊伍</th>
<th>累積總分</th>
<th>本次增加分數</th>
<th>操作</th>
</tr>
</thead>
<tbody id="scoreTable"></tbody>
</table>

<script>

// ✅ Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyDik4UsOMjmppT22GcRGjGG1GgLPPtvj6Q",
  authDomain: "fae-ap-pk.firebaseapp.com",
  databaseURL: "https://fae-ap-pk-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fae-ap-pk"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();


// ✅ 原始排名積分表：只適用於第 1–33 名
const baseRankPoints = {
    1:50,
    2:42,
    3:37,
    4:33,
    5:30,
    6:27,
    7:24,
    8:21,
    9:18,
    10:15,
    11:13,
    12:11,
    13:9,
    14:7,
    15:5,
    16:3,
    17:3,
    18:3,
    19:3,
    20:3,
    21:2,
    22:2,
    23:2,
    24:2,
    25:2,
    26:1,
    27:1,
    28:1,
    29:1,
    30:1,
    31:-1,
    32:-1,
    33:-1
};


// ✅ 計算最終排名積分
function getRankPoint(rank,total){

    // ✅ 累積總分 = 0 → -5
    if(total === 0){
        return -5;
    }

    // ✅ 第 34 名或以下 → -2
    if(rank >= 34){
        return -2;
    }

    // ✅ 第 1–33 名照原本積分
    return baseRankPoints[rank] ?? -2;
}


// ✅ Firebase key 安全處理
function safeKey(name){
    return name.replace(/[.#$/[\]]/g, "_");
}


// ✅ HTML 顯示安全處理，防止特殊字元造成錯誤
function escapeHtml(text){
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ✅ 即時監聽 Firebase 資料
db.ref("scores").on("value", snapshot => {

    const data = snapshot.val();
    const table = document.getElementById("scoreTable");
    table.innerHTML = "";

    if(!data) return;

    let arr = [];

    for(let key in data){
        arr.push({
            key: key,
            name: data[key].name || key,
            team: data[key].team || "",
            total: data[key].total || 0
        });
    }

    // ✅ 按累積總分由高至低排序
    arr.sort((a,b)=> b.total - a.total);

    arr.forEach((p,i)=>{

        let cls="";
        if(i===0) cls="rank1";
        if(i===1) cls="rank2";
        if(i===2) cls="rank3";

        const rank=i+1;
        const point=getRankPoint(rank,p.total);

        const inputId = "add_" + p.key;

        table.innerHTML += `
        <tr class="${cls}">
            <td>${rank}</td>
            <td class="pointsCol">${point}</td>
            <td>${escapeHtml(p.name)}</td>
            <td>${escapeHtml(p.team)}</td>
            <td>${p.total}</td>
            <td><input type="number" id="${inputId}"></td>
            <td>
                <button class="deleteBtn" onclick="deletePlayer('${p.key}','${escapeHtml(p.name)}')">刪除</button>
            </td>
        </tr>`;
    });

});


// ✅ 更新所有本次輸入分數
function updateAll(){

    db.ref("scores").once("value").then(snapshot=>{
        const data = snapshot.val();
        if(!data) return;

        for(let key in data){

            const inputId = "add_" + key;
            const input = document.getElementById(inputId);
            if(!input) continue;

            const value = parseFloat(input.value);

            if(!isNaN(value) && value !== 0){
                db.ref("scores/"+key+"/total").transaction(current=>{
                    return (current || 0) + value;
                });
            }
        }
    });

    setTimeout(()=>{
        document.querySelectorAll("input[type=number]").forEach(i=>i.value="");
    },500);

}


// ✅ 新增參賽者，不影響現有成績
function addPlayer(){

    const name = document.getElementById("newName").value.trim();
    const team = document.getElementById("newTeam").value.trim();

    if(!name || !team){
        alert("請輸入姓名與隊伍");
        return;
    }

    const key = safeKey(name);

    db.ref("scores/"+key).once("value").then(snapshot=>{
        if(snapshot.exists()){
            alert("此參賽者已存在");
        }else{
            db.ref("scores/"+key).set({
                name: name,
                team: team,
                total: 0
            });
            alert("✅ 已新增");
            document.getElementById("newName").value="";
            document.getElementById("newTeam").value="";
        }
    });
}


// ✅ 刪除參賽者
function deletePlayer(key,name){

    const pwd = prompt("請輸入刪除密碼");

    if(pwd !== "8888"){
        alert("密碼錯誤，已取消刪除");
        return;
    }

    const ok = confirm("確定要刪除參賽者：" + name + "？");

    if(!ok){
        return;
    }

    db.ref("scores/"+key).remove()
    .then(()=>{
        alert("✅ 已刪除：" + name);
    })
    .catch(error=>{
        alert("刪除失敗：" + error.message);
    });
}


// ✅ 重設全部分數
function resetAll(){

    const pwd = prompt("請輸入密碼");

    if(pwd==="8888"){

        db.ref("scores").once("value").then(snapshot=>{

            const data = snapshot.val();
            if(!data) return;

            for(let key in data){
                db.ref("scores/"+key+"/total").set(0);
            }

        });

        alert("已重設");
    }
}

</script>

</body>
</html>
